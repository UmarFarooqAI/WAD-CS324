
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Stats</title>
<style>
    

:root{
--primary-color:#00B4D8;
font-family: Arial, sans-serif;
}
body{    background-color: rgb(243, 241, 241);}

*{
padding:0px;
margin:0px;
}
.title { color: #0a2b85; }
/* SUMMARY */
.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-bottom: 30px;
}

.stat {
    background: #fbfbfb;
    border: 1px solid #e6eaf0;
    border-radius: 16px;
    padding: 25px;
}
.stat:hover {
    box-shadow: 0 12px 28px rgba(24, 59, 86, 0.10);
}

.number {
    color: #173996;
    font-size: 30px;
    font-weight: 900;
}

.stat h2 {
    color: #173996;
    font-size: 25px;
}

/* CHARTS */
.charts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
}
.card:hover {
    box-shadow: 0 12px 28px rgba(24, 59, 86, 0.10);
}

.card {
    padding: 27px;
    background: #fff;
    border: 1px solid #e6eaf0;
    border-radius: 16px;
}

.header h2 {
    color: #0b266e;
    font-size: 1.3rem;
    margin-bottom: 24px;
}

/* BARS */
.chart {
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.row {
    display: grid;
    grid-template-columns: 60px 1fr 55px;
    align-items: center;
    gap: 12px;
}

.label {
    color: #2e4575;
    font-size: 0.85rem;
    font-weight: 600;
}

.bar {
    height: 13px;
    border-radius: 50px;
    background: #4c5975;
}

.navbar{
border:2px solid black;
height:75px;
display:flex;
background-color:var(--primary-color);
justify-content:space-between;
align-items:center;
position:sticky;
top:0px;
}
#logo{
display:flex;
align-items:center;
justify-content:space-between;
}

a{
text-decoration:none;
color:black;
font-weight:bold;
padding:10px;
}

a:visited{
  color:red;
}

a:hover, a:active{
border-radius: 4px;
background-color:white;
color:black;
}

header img{
    height: 45px;
    width: 45px;
    object-fit: cover;
    border-radius: 50%;
}


.footer{
height:160px;
background-color:var(--primary-color);
border:3px solid black;
display:flex;
flex-direction:column;
justify-content:center;
width:95%;
margin:auto;
border-radius:8px;
}

.foot_container{
display:flex;
gap:10px;
}
.foot_container img{ 
height:60px;
width:60px; 
border-radius:30%;
}
.contact{
margin-bottom:30px;
font-size:18px;
}

#welnote{display:none;}
.low  { width: 42%; }
.mid  { width: 67%; }
.high { width: 100%; }

#one{
margin:8px;
}
#home{
display:flex;
marglin-left:5px;
justify-content:space-between;
}
.value {
    color: #16285a;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: right;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .charts { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
    .summary { grid-template-columns: 1fr; }
    .row { grid-template-columns: 55px 1fr 45px; }
}
</style>
</head>
<body>



<h1 class="title">Travel Statistics</h1>

<section class="summary">
    <article class="stat">
        <p class="number">12</p>
        <h2>Total Trips</h2>
    </article>
    <article class="stat">
        <p class="number">8</p>
        <h2>Places Visited</h2>
    </article>
    <article class="stat">
        <p class="number">1,245</p>
        <h2>Total Photos</h2>
    </article>
</section>

<section class="charts">

    <article class="card">
        <div class="header">
            <h2>Trips by Year</h2>
        </div>
        <div class="chart">
            <div class="row">
                <span class="label">2024</span>
                <div class="bar low"></div>
                <span class="value">5</span>
            </div>
            <div class="row">
                <span class="label">2025</span>
                <div class="bar mid"></div>
                <span class="value">8</span>
            </div>
            <div class="row">
                <span class="label">2026</span>
                <div class="bar high"></div>
                <span class="value">12</span>
            </div>
        </div>
    </article>

    <article class="card">
        <div class="header">
            <h2>Most Visited Places</h2>
        </div>
        <div class="chart">
            <div class="row">
                <span class="label">Lahore</span>
                <div class="bar low"></div>
                <span class="value">5</span>
            </div>
            <div class="row">
                <span class="label">Murree</span>
                <div class="bar mid"></div>
                <span class="value">8</span>
            </div>
            <div class="row">
                <span class="label">Hunza</span>
                <div class="bar high"></div>
                <span class="value">12</span>
            </div>
        </div>
    </article>

        <article class="card">
        <div class="header">
            <h2>Trips by Season</h2>
        </div>
        <div class="chart">
            <div class="row">
                <span class="label">Summer</span>
                <div class="bar high"></div>
                <span class="value">6</span>
            </div>
            <div class="row">
                <span class="label">Winter</span>
                <div class="bar mid"></div>
                <span class="value">4</span>
            </div>
            <div class="row">
                <span class="label">Spring</span>
                <div class="bar low"></div>
                <span class="value">2</span>
            </div>
        </div>
    </article>

    <article class="card">
        <div class="header">
            <h2>Travel Companions</h2>
        </div>
        <div class="chart">
            <div class="row">
                <span class="label">Friends</span>
                <div class="bar high"></div>
                <span class="value">7</span>
            </div>
            <div class="row">
                <span class="label">Family</span>
                <div class="bar mid"></div>
                <span class="value">4</span>
            </div>
            <div class="row">
                <span class="label">Solo</span>
                <div class="bar low"></div>
                <span class="value">1</span>
            </div>
        </div>
    </article>

    <article class="card">
        <div class="header">
            <h2>Transport Used</h2>
        </div>
        <div class="chart">
            <div class="row">
                <span class="label">Car</span>
                <div class="bar high"></div>
                <span class="value">8</span>
            </div>
            <div class="row">
                <span class="label">Bus</span>
                <div class="bar mid"></div>
                <span class="value">3</span>
            </div>
            <div class="row">
                <span class="label">Train</span>
                <div class="bar low"></div>
                <span class="value">1</span>
            </div>
        </div>
    </article>
</section>


</body>
</html>
